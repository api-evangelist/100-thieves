apis:
- aid: 100-thieves-ucp-commerce-mcp
  name: 100 Thieves UCP Commerce MCP API
  description: An anonymous Model Context Protocol endpoint implementing the Universal
    Commerce Protocol (UCP) shopping service for the 100 Thieves online store. Exposes
    thirteen tools covering catalog search and lookup, product detail, cart lifecycle,
    checkout lifecycle, and order retrieval. Checkout completion requires contemporaneous
    human buyer approval per the store's published agent rules.
  humanURL: https://100thieves.com/agents.md
  baseURL: https://100thieves.com/api/ucp/mcp
  tags:
  - MCP
  - Agentic Commerce
  - Commerce
  - Checkout
  - Catalog
  properties:
  - type: MCPServer
    url: mcp/100-thieves-mcp.yml
  - type: ToolCrosswalk
    url: mcp/100-thieves-tool-crosswalk.yml
- aid: 100-thieves-storefront-graphql
  name: 100 Thieves Storefront GraphQL API
  description: The Shopify Storefront GraphQL API as deployed on the 100 Thieves domain,
    version 2024-04. Schema introspection is open to anonymous callers and returns
    414 types, 35 query root fields and 41 mutations covering products, collections,
    blogs, pages, search, cart, customer accounts and Shop Pay payment request sessions.
  humanURL: https://shopify.dev/docs/api/storefront
  baseURL: https://100thieves.com/api/2024-04/graphql.json
  tags:
  - GraphQL
  - Commerce
  - Catalog
  - Cart
  properties:
  - type: GraphQL
    url: graphql/100-thieves-storefront.graphql
- aid: 100-thieves-storefront-json
  name: 100 Thieves Storefront JSON Endpoints
  description: The read-only JSON surface the store documents for agents that only
    need to browse catalog data without transacting - product JSON by handle, collection
    product listings, and product search. No authentication is required.
  humanURL: https://100thieves.com/agents.md
  baseURL: https://100thieves.com/
  tags:
  - JSON
  - Catalog
  - Read Only
