aid: 100-thieves
name: 100 Thieves
description: '100 Thieves is an American lifestyle brand and gaming organization founded
  in 2017 by Call of Duty World Champion Matthew "Nadeshot" Haag, headquartered in
  Los Angeles, California. The company operates championship esports franchises in
  League of Legends, VALORANT and Call of Duty, a roster of content creators, and a
  premium streetwear apparel line sold through its own direct-to-consumer online store.
  Its public machine-readable surface is that storefront: a Shopify-hosted commerce
  platform that publishes agent-facing instructions at /agents.md and /llms.txt, a
  Universal Commerce Protocol (UCP) merchant profile at /.well-known/ucp, an anonymous
  Model Context Protocol endpoint exposing thirteen catalog, cart, checkout and order
  tools, and a Storefront GraphQL API whose schema is openly introspectable. 100 Thieves
  publishes no developer portal, API reference, or SDKs of its own.'
