  graphql_type: Product
  identifiers: [id, handle]
  json_endpoint: GET /products/{handle}.json
  relationships:
  - {kind: has_many, target: ProductVariant, via: variants}
  - {kind: belongs_to_many, target: Collection, via: collections}
  - {kind: has_many, target: Image, via: images}
- name: ProductVariant
  surfaces: [mcp, graphql]
