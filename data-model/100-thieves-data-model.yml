note: >-
  Derived from the two machine-readable contracts actually served on the 100 Thieves
  host — the UCP/MCP tool input schemas and the introspected Storefront GraphQL schema.
  There is no OpenAPI to derive $ref links from, so entity relationships come from
  id-reference fields in the tool schemas and from GraphQL connection fields verified
  in the SDL.
entities:
