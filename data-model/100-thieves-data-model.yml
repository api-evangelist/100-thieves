  - {kind: belongs_to, target: ProductVariant, via: item.id}
  fields: [id, quantity, item.id]
- name: Checkout
  surfaces: [mcp]
  graphql_type: null
  identifiers: [id]
  relationships:
  - {kind: has_many, target: CartLine, via: line_items}
  - {kind: has_one, target: FulfillmentSelection, via: delivery}
  - {kind: has_many, target: Discount, via: discounts}
  - {kind: has_one, target: Order, via: order, note: complete_checkout yields the order.}
  note: MCP-only. The 2024-04 Storefront GraphQL schema exposes no checkout type; see
